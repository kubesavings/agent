version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # "/" covers the Dockerfile base images; "/helm" covers the image tag in
  # values.yaml (Dependabot's docker updater parses Helm values files too).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/helm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
