agent:
  # Required when existingSecret is not set
  apiKey: ""
  clusterId: ""

  # Use an existing Secret instead of creating one from apiKey/clusterId above.
  # The Secret must contain keys api-key and cluster-id (or override below).
  existingSecret: ""
  existingSecretApiKeyKey: "api-key"
  existingSecretClusterIdKey: "cluster-id"

  apiEndpoint: "https://app.kubesavings.io"
  includeNamespaces: ""
  excludeNamespaces: "kube-system,kube-public,kube-node-lease"
  cloudProvider: ""

  # Extra environment variables injected into the agent container.
  # Useful for RUST_LOG or proxy settings.
  # extraEnv:
  #   - name: RUST_LOG
  #     value: debug

  schedule: "0 * * * *"

  image:
    repository: ghcr.io/kubesavings/agent
    tag: "1.3.0"
    pullPolicy: IfNotPresent

  # The agent holds the cluster's pod/workload lists in memory for the duration
  # of a run, so the ceiling scales with cluster size. 256Mi covers a few
  # thousand pods; raise it for larger clusters.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # seccompProfile is required by the "restricted" Pod Security Standard —
  # without it the pod is rejected outright on clusters that enforce it.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  # Scheduling controls for clusters where nodes carry taints.
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  name: "kubesavings-agent"
  annotations: {}

networkPolicy:
  enabled: true
