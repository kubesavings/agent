syntax = "proto3";

package kubesavings.v1;

message WorkloadMetrics {
  string namespace = 1;
  string workload_type = 2;
  string workload_name = 3;
  string container_name = 4;
  uint32 replicas = 5;
  uint32 cpu_request_m = 6;
  uint32 cpu_limit_m = 7;
  uint32 memory_request_mi = 8;
  uint32 memory_limit_mi = 9;
  double actual_cpu_avg_m = 10;
  double actual_cpu_p95_m = 11;
  double actual_memory_avg_mi = 12;
  double actual_memory_p95_mi = 13;
  uint32 observation_days = 14;

  // The agent's own flat-rate estimate for this workload (request-based, at the
  // collector's hardcoded CPU/memory rates). It is what the agent sums into
  // NamespaceMetrics.estimated_monthly_cost_usd and AgentSnapshot
  // .estimated_cluster_cost_usd, so it stays on the wire as the raw input behind
  // both totals.
  //
  // The backend deliberately does not price anything from it: every category
  // reprices from requests through cloud_pricing, using rates derived from the
  // cluster's actual node pools. Two cost models on one dashboard is the problem
  // that was already solved for zombie-namespace. Treat this as diagnostic - it
  // shows what the agent thought - not as a figure to bill against.
  double estimated_monthly_cost_usd = 15;

  // 16 was last_active_timestamp: the agent hardcoded it to "" from the first
  // release and nothing ever read it. Reserved rather than reused, so a future
  // field cannot inherit a tag that older agents may still emit.
  reserved 16;

  // --- Autoscaler context (all optional; 0 / false / "" means "not present",
  // so the backend checks no-op until the agent starts populating them) ---
  bool has_hpa = 17;                  // a HorizontalPodAutoscaler targets this workload
  uint32 hpa_min_replicas = 18;       // HPA spec.minReplicas
  uint32 hpa_max_replicas = 19;       // HPA spec.maxReplicas
  uint32 hpa_target_cpu_pct = 20;     // HPA averageUtilization target for CPU (%)
  uint32 hpa_current_replicas = 21;   // HPA status.currentReplicas
  bool cronjob_suspended = 22;        // CronJob spec.suspend
  string cronjob_last_schedule_ts = 23; // CronJob status.lastScheduleTime (RFC3339); "" if never
  uint32 cronjob_recent_failures = 24;  // failed Jobs owned by this CronJob in the recent window
  bool keda_scaled = 25;              // a KEDA ScaledObject targets this workload
  uint32 keda_min_replicas = 26;      // KEDA spec.minReplicaCount
  string keda_trigger_types = 27;     // comma-separated KEDA trigger types (e.g. "kafka,cron"); "" if none

  // --- Right-sizing guardrails ---
  //
  // Right-sizing recommends shrinking requests toward observed usage. Nothing in
  // the schema above says whether that is safe to do, so these carry the signals
  // that make a recommendation harmful:
  uint32 restart_count = 28;      // container restarts summed across the workload's pods
  uint32 oom_killed_count = 29;   // containers whose last termination was OOMKilled;
                                  // >0 means never recommend a smaller memory request
  string qos_class = 30;          // "Guaranteed" | "Burstable" | "BestEffort"; "" if unknown.
                                  // Guaranteed requires request == limit, so a request-only
                                  // change silently demotes the pod and alters its eviction priority
  bool has_pdb = 31;              // a PodDisruptionBudget selects this workload's pods
  uint32 pdb_min_available = 32;  // PDB spec.minAvailable when an absolute count;
                                  // 0 when expressed as a percentage or unset — read has_pdb, not this,
                                  // to decide whether the workload is guarded
}

message NamespaceMetrics {
  string name = 1;
  uint32 workload_count = 2;
  uint32 days_since_last_activity = 3;
  double estimated_monthly_cost_usd = 4;
}

message NodePool {
  string instance_type = 1;   // e.g. "m5.xlarge"; "" if label missing
  string region        = 2;   // e.g. "us-east-1"; "" if unknown
  string capacity_type = 3;   // "on-demand" | "spot" | ""
  uint32 node_count    = 4;   // nodes in this group

  // Capacity of a SINGLE node in this pool, not the pool total. A pool is keyed
  // by (instance_type, region, capacity_type) and is therefore homogeneous, so
  // one node's figures times node_count give the pool. Averaged across the pool's
  // nodes, which only differ if the cluster is mid-upgrade.
  //
  // `allocatable` is what schedulers can actually place pods into — capacity minus
  // kubelet/system reservations and eviction thresholds — so it, not `capacity`,
  // is the denominator for any packing calculation. Both are 0 if the node status
  // did not report them.
  uint32 cpu_allocatable_m     = 5;
  uint32 memory_allocatable_mi = 6;
  uint32 cpu_capacity_m        = 7;
  uint32 memory_capacity_mi    = 8;
}

message AgentSnapshot {
  string k8s_version = 1;
  uint32 node_count = 2;
  string cloud_provider = 3;
  repeated WorkloadMetrics workloads = 4;
  repeated NamespaceMetrics namespaces = 5;
  double estimated_cluster_cost_usd = 6;
  string collected_at = 7;
  string region = 8;                   // primary/most-common cluster region; "" if mixed/unknown
  repeated NodePool node_pools = 9;
  string agent_version = 10;            // kubesavings-agent version (CARGO_PKG_VERSION); "" if unknown

  // True when metrics-server answered this run. The collector degrades to zero
  // usage when it does not, and every `actual_*` field below defines 0 as both
  // "measured zero" and "no data" — this is what tells the two apart. Absent
  // (false) from an older agent, which the backend must treat as "unknown"
  // rather than "no metrics".
  bool metrics_available = 11;

  // Wall-clock time the collection pass took, in milliseconds. 0 = not reported
  // (older agent), which is indistinguishable from an impossibly fast pass only
  // in theory: a real pass always costs at least one API round trip.
  uint32 collection_duration_ms = 12;

  // Subsystems whose data the pass failed to fetch, deduplicated and sorted -
  // e.g. "pods", "metrics-server", "poddisruptionbudgets". Empty = a clean pass.
  //
  // These are non-fatal: the collector logs a warning and carries on with the
  // rest, so the snapshot still arrives. The numbers alone cannot say whether a
  // workload has no PodDisruptionBudget or whether the PDB list call failed, and
  // a recommendation derived from the second case is wrong rather than merely
  // incomplete. This is what lets the backend tell them apart.
  //
  // A missing KEDA CRD is deliberately absent from this list: it is the normal
  // state of most clusters, not a failure.
  repeated string partial_failures = 13;
}

message SnapshotResponse {
  string status = 1;                 // "accepted"
  uint32 recommendations = 2;        // open recommendation count
  double total_savings_usd = 3;
}
